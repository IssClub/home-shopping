name: price-sync
on:
  schedule:
    - cron: '17 1 * * *'     # nightly, about 03:17 Israel time (winter)
    - cron: '*/10 * * * *'   # light check: runs only if the app asked for a refresh
  workflow_dispatch:
concurrency:
  group: price-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - name: Run sync
        working-directory: sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MODE: ${{ (github.event.schedule == '*/10 * * * *') && 'check' || 'nightly' }}
        run: python sync.py
