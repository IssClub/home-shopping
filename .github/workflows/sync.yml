name: price-sync
on:
  schedule:
    - cron: '17 1 * * *'     # nightly, about 03:17 Israel time (winter)
    - cron: '*/10 * * * *'   # light check: runs only if the app asked for a refresh
  workflow_dispatch:
concurrency:
  group: price-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: sync/requirements.txt }
      - run: pip install -r sync/requirements.txt
      - name: Run sync
        working-directory: sync
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MODE: ${{ (github.event.schedule == '*/10 * * * *') && 'check' || 'nightly' }}
        run: python sync.py
