<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>קניות הבית</title>
<meta name="theme-color" content="#0b7f66">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="קניות הבית">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Rubik:wght@500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><h1>קניות הבית</h1><div class="date" id="date"></div></div>
    <button class="chip" id="syncchip" data-act="refresh" aria-label="רענון מחירים"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></svg><span id="synctxt">מחירים</span></button>
  </header>
  <form class="addbar" id="addform" hidden>
    <input id="addin" type="text" placeholder="מה להוסיף? למשל: 2 חלב, לחם, עגבניות" autocomplete="off" enterkeyhint="done">
    <button class="btn" type="submit">הוסף</button>
  </form>
  <div class="demo" id="demo" hidden>מצב הדגמה: השרת (Supabase) עדיין לא הוגדר, הנתונים נשמרים רק במכשיר הזה.</div>
  <main id="view"></main>
  <p style="text-align:center"><button class="iconbtn" id="logout" hidden>התנתקות</button></p>
</div>

<nav class="tabs" aria-label="ניווט">
  <div class="in">
    <button data-tab="list"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>הרשימה</button>
    <button data-tab="shop"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a1.5 1.5 0 0 0 1.5 1.2h8.2a1.5 1.5 0 0 0 1.5-1.1L20 8H6"/><circle cx="9.5" cy="20" r="1.2"/><circle cx="17" cy="20" r="1.2"/></svg>בסופר<span class="badge" id="leftbadge" hidden></span></button>
    <button data-tab="compare"><svg viewBox="0 0 24 24"><path d="M12 3v18M5 7h14M5 7l-2.5 6a3 3 0 0 0 5 0L5 7zm14 0l-2.5 6a3 3 0 0 0 5 0L19 7z"/></svg>השוואה</button>
    <button data-tab="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>עוד</button>
  </div>
</nav>
<div class="toast" id="toast" aria-live="polite"></div>
<div id="sheetroot"></div>
<div id="dlgroot"></div>


<div class="login" id="login" hidden>
  <form id="loginform"><h2>קניות הבית</h2><span class="note">התחברו עם החשבון המשותף של הבית.</span>
    <div class="field"><label for="lemail">אימייל</label><input id="lemail" type="email" autocomplete="username" required></div>
    <div class="field"><label for="lpass">סיסמה</label><input id="lpass" type="password" autocomplete="current-password" required></div>
    <button class="btn" type="submit">התחבר</button><span class="note" id="loginmsg" aria-live="polite"></span></form>
</div>
<script src="supabase-config.js"></script>
<script src="cloud.js"></script>
<script src="app.js"></script>
</body>
</html>
